services:
  postgres:
    container_name: postgres
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    
    restart: always
    volumes:
      - amir_web_postgres_data:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT}:5432"

volumes:
  amir_web_postgres_data:

